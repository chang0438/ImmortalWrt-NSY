name: Delete Old Workflows

on:
  workflow_dispatch:
  schedule:
    - cron: '0 3 * * *'

permissions:
  actions: write
  contents: write

jobs:
  Cleaning:
    runs-on: ubuntu-22.04

    steps:
    - name: Delete Old Workflows
      uses: Mattraks/delete-workflow-runs@main
      with:
        token: ${{ secrets.GITHUB_TOKEN }}
        retain_days: 20
        keep_minimum_runs: 15

    - name: Delete Old Releases
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      run: |
        set -euo pipefail
        
        KEEP_LATEST=180
        echo "📋 Fetching releases and filtering..."
        
        # 【优化1】直接在 jq 中完成排序确认与切片，避免 shell 层多次处理大文本
        # gh 默认按 createdAt 降序排列，jq 直接跳过前 N 个
        TO_DELETE=$(gh release list --limit 1000 --json tagName,createdAt \

          | jq -r ".[$KEEP_LATEST:] | .[] | .tagName")
        
        if [ -z "$TO_DELETE" ]; then
          echo "✅ No releases to delete. (Total <= $KEEP_LATEST)"
          exit 0
        fi
        
        DELETE_COUNT=$(echo "$TO_DELETE" | wc -l)
        echo "🗑️  Will delete $DELETE_COUNT old release(s)..."
        
        # 【优化2】使用进程替换代替管道，避免子 Shell 变量作用域问题
        while IFS= read -r tag; do
          [ -z "$tag" ] && continue
          echo "  → Deleting: $tag"
          gh release delete "$tag" --yes --cleanup-tag 2>&1 || echo "  ⚠️ Failed to delete $tag (may already be removed or protected)"
        done < <(echo "$TO_DELETE")
        
        echo "✅ Cleanup completed successfully."
