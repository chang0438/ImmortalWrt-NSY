name: Delete Old Workflows

on:
  workflow_dispatch:
  schedule:
    - cron: '0 3 * * *'

permissions:
  actions: write
  contents: write

jobs:
  Cleaning:
    runs-on: ubuntu-22.04

    steps:
    - name: Delete Old Workflows
      uses: Mattraks/delete-workflow-runs@main
      with:
        token: ${{ secrets.GITHUB_TOKEN }}
        retain_days: 20
        keep_minimum_runs: 15

    - name: Delete Old Releases
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      run: |
        set -eo pipefail  # 【修复1】移除 -u，避免空变量触发 exit 2
        
        KEEP_LATEST=180
        echo "📋 Fetching releases..."
        
        TO_DELETE=$(gh release list --limit 1000 --json tagName,createdAt \

          | jq -r ".[$KEEP_LATEST:] | .[] | .tagName" || true)
        
        if [ -z "$TO_DELETE" ]; then
          echo "✅ No releases to delete. (Total <= $KEEP_LATEST)"
          exit 0
        fi
        
        DELETE_COUNT=$(echo "$TO_DELETE" | wc -l | tr -d ' ')
        echo "🗑️  Will delete $DELETE_COUNT old release(s)..."
        
        while IFS= read -r tag; do
          [ -z "$tag" ] && continue
          echo "  → Deleting release: $tag"
          gh release delete "$tag" --yes 2>&1 || echo "  ⚠️ Release $tag may already be deleted"
          
          echo "  → Deleting tag: $tag"
          git push origin --delete "$tag" 2>&1 || echo "  ⚠️ Tag $tag may not exist or already deleted"
        done < <(echo "$TO_DELETE")
        
        echo "✅ Cleanup completed successfully."
