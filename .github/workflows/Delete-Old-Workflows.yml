name: Delete Old Workflows

on:
  workflow_dispatch:
  schedule:
    - cron: '0 3 * * *'

permissions:
  actions: write
  contents: write

jobs:
  Cleaning:
    runs-on: ubuntu-22.04

    steps:
    - name: Delete Old Workflows
      uses: Mattraks/delete-workflow-runs@main
      with:
        token: ${{ secrets.GITHUB_TOKEN }}
        retain_days: 20
        keep_minimum_runs: 15

    - name: Delete Old Releases
      # 【修复1】锁定具体版本号，避免 @master 的 Node.js 弃用警告
      uses: dev-drprasad/delete-older-releases@v0.2.1 
      with:
        keep_latest: 180
        delete_tags: true
        # 【修复2】移除这里的 token 参数！该 Action 不支持此输入
      env:
        # 【修复3】Token 必须通过 env 环境变量传入
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
