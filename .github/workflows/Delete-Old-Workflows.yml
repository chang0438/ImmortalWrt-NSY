name: Delete Old Workflows

on:
  workflow_dispatch:
  schedule:
    - cron: '0 3 * * *'  # 建议加上引号

# 【新增】声明 GITHUB_TOKEN 的权限，这是必须的！
permissions:
  actions: write       # 删除 workflow runs 需要
  contents: write      # 删除 releases 和 tags 需要

jobs:
  Cleaning:
    runs-on: ubuntu-22.04

    steps:
    - name: Delete Old Workflows
      uses: Mattraks/delete-workflow-runs@main
      with:
        # 【修改】改用默认的 GITHUB_TOKEN
        token: ${{ secrets.GITHUB_TOKEN }}
        retain_days: 20
        keep_minimum_runs: 15

    - name: Delete Old Releases
      uses: dev-drprasad/delete-older-releases@master
      with:
        keep_latest: 180
        delete_tags: true
        # 【修改】改用默认的 GITHUB_TOKEN，并移到 with 下（该 action 推荐用法）
        token: ${{ secrets.GITHUB_TOKEN }}
