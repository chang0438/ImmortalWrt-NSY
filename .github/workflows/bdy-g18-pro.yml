name: bdy-g18-pro

on:
  workflow_dispatch:
  schedule:
    - cron: 0 20 * * *

env:
  REPO_URL: https://github.com/zhoufuli/immortalwrt-rk356x
  REPO_BRANCH: main
  # 必须替换为已经验证成功的上游 commit。
  # 不建议直接跟随 main，避免上游 feed 或 package 变化导致构建突然失败。
  OPENWRT_COMMIT: 25d59560bf989fe011a22c3e2fbe0a012976e064
  CONFIG_FILE: configs/g18-pro-docker.config
  DIY_SCRIPT: diy-mini.sh
  CLASH_KERNEL: arm64
  CACHE_TOOLCHAIN: false
  UPLOAD_BIN_DIR: false
  FIRMWARE_RELEASE: true
  FIRMWARE_TAG: bdy-g18-pro
  TZ: Asia/Shanghai
  GITHUB_TOKEN: ${{ secrets.ACCESS_TOKEN }}

jobs:
  Build:
    runs-on: ubuntu-22.04

    outputs:
      COMMIT_AUTHOR: ${{ steps.clone.outputs.COMMIT_AUTHOR }}
      COMMIT_DATE: ${{ steps.clone.outputs.COMMIT_DATE }}
      COMMIT_MESSAGE: ${{ steps.clone.outputs.COMMIT_MESSAGE }}
      COMMIT_HASH: ${{ steps.clone.outputs.COMMIT_HASH }}
      DEVICE_TARGET: ${{ steps.variable.outputs.DEVICE_TARGET }}
      DEVICE_SUBTARGET: ${{ steps.variable.outputs.DEVICE_SUBTARGET }}

    steps:
    - name: Merge Disks
      uses: easimon/maximize-build-space@master
      with:
        swap-size-mb: 1024
        temp-reserve-mb: 100
        root-reserve-mb: 1024

    - name: Checkout
      uses: actions/checkout@main

    - name: Create a Working Directory
      run: |
        mkdir -p ${GITHUB_WORKSPACE}/workdir
        chmod 755 ${GITHUB_WORKSPACE}/workdir
        echo "WORKDIR_PATH=$PWD" >> $GITHUB_ENV

    - name: Check Server Performance
      run: |
        echo "警告⚠"
        echo "分配的服务器性能有限，若选择的插件过多，务必注意CPU性能！"
        echo -e "已知CPU型号(降序): 7763，8370C，8272CL，8171M，E5-2673\n"
        echo "--------------------------CPU信息--------------------------"
        echo "CPU物理数量: $(cat /proc/cpuinfo | grep "physical id" | sort | uniq | wc -l)"
        echo "CPU核心数量: $(nproc)"
        echo -e "CPU型号信息:$(cat /proc/cpuinfo | grep -m1 name | awk -F: '{print $2}')\n"
        echo "--------------------------内存信息--------------------------"
        echo "已安装内存详细信息:"
        echo -e "$(sudo lshw -short -C memory | grep GiB)\n"
        echo "--------------------------硬盘信息--------------------------"
        echo "硬盘数量: $(ls /dev/sd* | grep -v [1-9] | wc -l)" && df -hT

    - name: Initialization Environment
      env:
        DEBIAN_FRONTEND: noninteractive
      run: |
        df -hT
        [ -n "$(docker images -q)" ] && docker rmi $(docker images -q)
        sudo rm -rf /usr/share/dotnet /etc/apt/sources.list.d /usr/local/lib/android $AGENT_TOOLSDIRECTORY
        sudo -E apt-get -y purge azure-cli ghc* zulu* llvm* firefox google* dotnet* powershell openjdk* mongodb* moby* || true
        sudo -E apt-get -y update
        sudo -E apt-get -y install \
          build-essential clang flex bison g++ gawk \
          gcc-multilib gettext git libncurses5-dev \
          libssl-dev python3 python3-distutils \
          python3-setuptools rsync swig unzip \
          zlib1g-dev file wget curl
        sudo -E apt-get -y install python3-pyelftools
        sudo -E systemctl daemon-reload
        sudo -E apt-get -y autoremove --purge
        sudo -E apt-get -y clean
        sudo timedatectl set-timezone "$TZ"

    - name: Clone Source Code
      working-directory: ${{ env.WORKDIR_PATH }}/workdir
      id: clone
      run: |
        set -Eeuo pipefail

        df -hT
        git clone \
          --no-tags \
          --single-branch \
          --branch "$REPO_BRANCH" \
          "$REPO_URL" \
          openwrt

        cd openwrt

        if [ "$OPENWRT_COMMIT" = "REPLACE_WITH_KNOWN_GOOD_COMMIT" ] || \
           [ -z "$OPENWRT_COMMIT" ]; then
          echo "::error::OPENWRT_COMMIT 未配置。请填写已验证成功的上游 commit。"
          exit 1
        fi

        # 获取并固定到指定 commit，避免直接使用 main 最新状态。
        git fetch --no-tags origin "$OPENWRT_COMMIT"
        git checkout --detach "$OPENWRT_COMMIT"
        git submodule update --init --recursive

        echo "Using OpenWrt commit: $(git rev-parse HEAD)"
        echo "OPENWRT_PATH=$PWD" >> $GITHUB_ENV

        COMMIT_AUTHOR=$(git show -s --date=short --format="作者: %an")
        echo "COMMIT_AUTHOR=$COMMIT_AUTHOR" >> $GITHUB_ENV
        echo "COMMIT_AUTHOR=$COMMIT_AUTHOR" >> $GITHUB_OUTPUT
        COMMIT_DATE=$(git show -s --date=short --format="时间: %ci")
        echo "COMMIT_DATE=$COMMIT_DATE" >> $GITHUB_ENV
        echo "COMMIT_DATE=$COMMIT_DATE" >> $GITHUB_OUTPUT
        COMMIT_MESSAGE=$(git show -s --date=short --format="内容: %s")
        echo "COMMIT_MESSAGE=$COMMIT_MESSAGE" >> $GITHUB_ENV
        echo "COMMIT_MESSAGE=$COMMIT_MESSAGE" >> $GITHUB_OUTPUT
        COMMIT_HASH=$(git show -s --date=short --format="hash: %H")
        echo "COMMIT_HASH=$COMMIT_HASH" >> $GITHUB_ENV
        echo "COMMIT_HASH=$COMMIT_HASH" >> $GITHUB_OUTPUT

    - name: Install Feeds
      run: |
        set -Eeuo pipefail

        df -hT
        cd "$OPENWRT_PATH"

        feed_failed() {
          status=$?
          echo "::error::OpenWrt feeds 操作失败，退出码: $status"
          echo "========== feeds.conf.default =========="
          [ -f feeds.conf.default ] && cat feeds.conf.default || true
          echo "========== feeds.conf =========="
          [ -f feeds.conf ] && cat feeds.conf || true
          echo "========== feed directories =========="
          find feeds -maxdepth 2 -type d -print 2>/dev/null | sort || true
          exit "$status"
        }
        trap feed_failed ERR

        # 清理可能来自源码或 runner 缓存的旧 feed 状态。
        ./scripts/feeds clean || true
        rm -rf feeds

        # 网络波动时允许重新拉取一次；真正错误不会被忽略。
        for attempt in 1 2 3; do
          echo "Updating feeds, attempt ${attempt}/3"
          if ./scripts/feeds update -a; then
            break
          fi

          if [ "$attempt" -eq 3 ]; then
            echo "::error::feeds update 连续失败 3 次"
            exit 1
          fi

          rm -rf feeds
          sleep 10
        done

        ./scripts/feeds install -a
        ./scripts/feeds list
        trap - ERR

    - name: Patch U-Boot DTS (fix xpcs/rng labels)
      run: |
        set -Eeuo pipefail
        cd "$OPENWRT_PATH"
        # Find and fix the U-Boot DTS for bdy-g18-pro
        DTS_FILE=$(find package/boot/uboot-rockchip -name "rk3568-bdy-g18-pro.dts" 2>/dev/null | head -1)
        if [ -f "$DTS_FILE" ]; then
          echo "Patching $DTS_FILE"
          # Comment out references to non-existent labels xpcs and rng
          sed -i 's/&xpcs;/\/\/ &xpcs;/g' "$DTS_FILE"
          sed -i 's/&rng;/\/\/ &rng;/g' "$DTS_FILE"
          # Also handle property assignments
          sed -i 's/xpcs = <&xpcs[^>]*>;/\/\/ xpcs = <&xpcs_phy>;/g' "$DTS_FILE"
          sed -i 's/rng = <&rng[^>]*>;/\/\/ rng = <&rng_phy>;/g' "$DTS_FILE"
          echo "Patched DTS file"
        else
          echo "Warning: DTS file not found, skipping patch"
        fi

    - name: Disable Rust package (prevent host-compile)
      run: |
        set -Eeuo pipefail
        cd "$OPENWRT_PATH"
        # Remove rust package from feeds to prevent any dependency pulling it in
        RUST_PKG="feeds/packages/lang/rust"
        if [ -d "$RUST_PKG" ]; then
          echo "Disabling rust package at $RUST_PKG"
          # Rename to disable it completely
          mv "$RUST_PKG" "${RUST_PKG}.disabled"
        fi
        # Also disable any rust-dependent packages that might be in feeds
        for pkg in feeds/packages/*/rust*; do
          if [ -d "$pkg" ] && [[ "$pkg" != *.disabled ]]; then
            echo "Disabling rust-dependent package: $pkg"
            mv "$pkg" "${pkg}.disabled"
          fi
        done
        # Disable rust in luci feed if present
        for pkg in feeds/luci/*/rust*; do
          if [ -d "$pkg" ] && [[ "$pkg" != *.disabled ]]; then
            echo "Disabling luci rust package: $pkg"
            mv "$pkg" "${pkg}.disabled"
          fi
        done

    - name: Generate Variables
      id: variable
      run: |
        set -Eeuo pipefail

        df -hT

        cp "$GITHUB_WORKSPACE/$CONFIG_FILE" "$OPENWRT_PATH/.config"
        cd "$OPENWRT_PATH"

        echo "========== OpenWrt commit =========="
        git rev-parse HEAD

        echo "========== Initial configuration =========="
        grep -E '^(CONFIG_TARGET|CONFIG_PACKAGE|CONFIG_DEFAULT)' .config || true

        echo "========== Running defconfig =========="
        make defconfig V=s

        echo "========== Final configuration =========="
        grep -E '^(CONFIG_TARGET|CONFIG_PACKAGE|CONFIG_DEFAULT)' .config || true

        SOURCE_REPO="$(basename "$REPO_URL")"
        echo "SOURCE_REPO=$SOURCE_REPO" >> "$GITHUB_ENV"

        DEVICE_TARGET=$(awk -F '"' '/^CONFIG_TARGET_BOARD=/{print $2}' .config)
        DEVICE_SUBTARGET=$(awk -F '"' '/^CONFIG_TARGET_SUBTARGET=/{print $2}' .config)

        test -n "$DEVICE_TARGET" || {
          echo "::error::CONFIG_TARGET_BOARD is missing after defconfig"
          exit 1
        }

        test -n "$DEVICE_SUBTARGET" || {
          echo "::error::CONFIG_TARGET_SUBTARGET is missing after defconfig"
          exit 1
        }

        echo "DEVICE_TARGET=$DEVICE_TARGET" >> "$GITHUB_ENV"
        echo "DEVICE_TARGET=$DEVICE_TARGET" >> "$GITHUB_OUTPUT"
        echo "DEVICE_SUBTARGET=$DEVICE_SUBTARGET" >> "$GITHUB_ENV"
        echo "DEVICE_SUBTARGET=$DEVICE_SUBTARGET" >> "$GITHUB_OUTPUT"

    - name: Cache Toolchain
      if: env.CACHE_TOOLCHAIN == 'true'
      uses: HiGarfield/cachewrtbuild@main
      with:
        ccache: false
        mixkey: ${{ env.SOURCE_REPO }}-${{ env.REPO_BRANCH }}-${{ env.DEVICE_TARGET }}-${{ env.DEVICE_SUBTARGET }}
        prefix: ${{ env.OPENWRT_PATH }}

    - name: Load Custom Configuration
      run: |
        set -Eeuo pipefail

        df -hT
        [ -e "$GITHUB_WORKSPACE/files" ] && \
          cp -a "$GITHUB_WORKSPACE/files" "$OPENWRT_PATH/files"

        chmod +x "$GITHUB_WORKSPACE"/scripts/*.sh
        chmod +x "$GITHUB_WORKSPACE/$DIY_SCRIPT"

        cd "$OPENWRT_PATH"
        "$GITHUB_WORKSPACE/$DIY_SCRIPT"
        "$GITHUB_WORKSPACE/scripts/preset-clash-core.sh" "$CLASH_KERNEL"
        # $GITHUB_WORKSPACE/scripts/preset-adguard-core.sh $CLASH_KERNEL

    - name: Download DL Package
      run: |
        set -Eeuo pipefail

        df -hT
        cd "$OPENWRT_PATH"
        make defconfig
        make download -j8
        find dl -size -1024c -exec ls -l {} \;

    - name: Compile Firmware
      id: compile
      run: |
        set -Eeuo pipefail

        df -hT
        cd "$OPENWRT_PATH"

        mkdir -p files/etc/uci-defaults
        cp "$GITHUB_WORKSPACE/scripts/init-settings.sh" \
          files/etc/uci-defaults/99-init-settings

        echo "清理可能损坏的 Rust 主机源码和构建目录"

        rm -rf \
          build_dir/target-*/host/rustc-*-src \
          build_dir/target-*/host/rustc-* \
          staging_dir/host

        # 删除明显不完整的下载文件
        find dl -type f -size -1024c -delete

        make defconfig
        make download -j1 V=s

        echo "$(nproc) thread compile"
        if ! make -j"$(nproc)"; then
          echo "::warning::并行编译失败，开始单线程详细重试"
          make -j1 V=s
        fi

        echo "status=success" >> $GITHUB_OUTPUT
        echo "DATE=$(date +"%Y-%m-%d %H:%M:%S")" >> $GITHUB_ENV
        echo "TAG_DATE=$(date +"%Y.%m.%d-%H.%M")" >> $GITHUB_ENV
        echo "FILE_DATE=$(date +"%Y.%m.%d")" >> $GITHUB_ENV

    - name: Check Space Usage
      if: (!cancelled())
      run: df -hT

    - name: Upload Bin Directory
      if: steps.compile.outputs.status == 'success' && env.UPLOAD_BIN_DIR == 'true'
      uses: actions/upload-artifact@main
      with:
        name: ${{ env.SOURCE_REPO }}-bin-${{ env.DEVICE_TARGET }}-${{ env.DEVICE_SUBTARGET }}-${{ env.FILE_DATE }}
        path: ${{ env.OPENWRT_PATH }}/bin

    - name: Organize Files
      if: steps.compile.outputs.status == 'success'
      run: |
        cd $OPENWRT_PATH/bin/targets/*/*
        cat sha256sums
        cp $OPENWRT_PATH/.config build.config
        mv -f $OPENWRT_PATH/bin/packages/*/*/*.ipk packages
        tar -zcf Packages.tar.gz packages
        rm -rf packages feeds.buildinfo version.buildinfo
        echo "KERNEL=$(cat *.manifest | grep ^kernel | cut -d- -f2 | tr -d ' ')" >> $GITHUB_ENV
        echo "FIRMWARE_PATH=$PWD" >> $GITHUB_ENV

    - name: Upload Firmware To Artifact
      if: steps.compile.outputs.status == 'success' && env.FIRMWARE_RELEASE != 'true'
      uses: actions/upload-artifact@main
      with:
        name: ${{ env.SOURCE_REPO }}-firmware-${{ env.DEVICE_TARGET }}-${{ env.DEVICE_SUBTARGET }}-${{ env.FILE_DATE }}
        path: ${{ env.FIRMWARE_PATH }}

    - name: Upload Firmware To Release
      if: steps.compile.outputs.status == 'success' && env.FIRMWARE_RELEASE == 'true'
      uses: ncipollo/release-action@v1
      with:
        name: R${{ env.DATE }} for ${{ env.FIRMWARE_TAG }}
        allowUpdates: true
        tag: ${{ env.TAG_DATE }}-${{ env.FIRMWARE_TAG }}
        token: ${{ env.GITHUB_TOKEN }}
        artifacts: ${{ env.FIRMWARE_PATH }}/*
        body: |
          **This is OpenWrt Firmware for ${{ env.FIRMWARE_TAG }}**
          ### 📒 固件信息
          - 💻 平台架构: ${{ env.DEVICE_TARGET }}-${{ env.DEVICE_SUBTARGET }} (rk33xx, rk35xx)
          - ⚽ 固件源码: ${{ env.REPO_URL }}
          - 💝 源码分支: ${{ env.REPO_BRANCH }}
          - 🚀 内核版本: ${{ env.KERNEL }}
          - 🌐 默认地址: 192.168.1.200
          - 🔑 默认密码: password
          ### 🧊 固件版本
          - 固件编译前最后一次➦[主源码](${{ env.REPO_URL }})更新记录
          - ${{ env.COMMIT_AUTHOR }}
          - ${{ env.COMMIT_DATE }}
          - ${{ env.COMMIT_MESSAGE }}
          - ${{ env.COMMIT_HASH }}
